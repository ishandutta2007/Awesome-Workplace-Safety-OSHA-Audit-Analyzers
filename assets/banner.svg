<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="45%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#09101f"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7a18"/>
      <stop offset="50%" stop-color="#ffaa00"/>
      <stop offset="100%" stop-color="#00e5a3"/>
    </linearGradient>

    <linearGradient id="cyberCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#0066ff"/>
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9900" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00e5a3" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="neonPill" x="-10%" y="-20%" width="120%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>

    <style>
      @keyframes radarSweep {
        0% { transform: translateY(-380px); opacity: 0; }
        30% { opacity: 0.6; }
        70% { opacity: 0.6; }
        100% { transform: translateY(380px); opacity: 0; }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.75; transform: scale(1.04); }
      }
      @keyframes beaconRing {
        0% { r: 6; opacity: 1; stroke-width: 2; }
        100% { r: 24; opacity: 0; stroke-width: 0.5; }
      }
      @keyframes floatSoft {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes floatOpposite {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(6px); }
      }
      @keyframes borderShift {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 600; }
      }

      .radar-line {
        animation: radarSweep 6s ease-in-out infinite;
      }
      .beacon {
        animation: beaconRing 2.4s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
      }
      .glowing-orb {
        animation: pulseGlow 4s ease-in-out infinite;
        transform-origin: center;
      }
      .floating-card-1 {
        animation: floatSoft 5s ease-in-out infinite;
      }
      .floating-card-2 {
        animation: floatOpposite 6s ease-in-out infinite;
      }
      .animated-border {
        stroke-dasharray: 40 20;
        animation: borderShift 25s linear infinite;
      }
    </style>
  </defs>

  <!-- Outer Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Background Grid Pattern -->
  <rect width="1200" height="360" rx="16" fill="url(#grid)" />

  <!-- Decorative Background Orbs (Behind Everything) -->
  <g class="glowing-orb" filter="url(#glow)">
    <circle cx="150" cy="80" r="100" fill="#ff7a18" opacity="0.12" />
    <circle cx="1060" cy="260" r="130" fill="#00e5a3" opacity="0.1" />
    <circle cx="980" cy="80" r="90" fill="#00d2ff" opacity="0.1" />
  </g>

  <!-- Subtle Animated Radar Scan Wave in Background -->
  <g opacity="0.4">
    <line x1="0" y1="0" x2="1200" y2="0" stroke="url(#accentGrad)" stroke-width="2" class="radar-line" />
  </g>

  <!-- Giant Faint Safety Shield Watermark (Layered Behind Content) -->
  <path d="M 1020,70 L 1120,110 L 1120,200 C 1120,260 1020,300 1020,300 C 1020,300 920,260 920,200 L 920,110 Z"
        fill="url(#shieldGrad)" stroke="rgba(255, 170, 0, 0.15)" stroke-width="2" />

  <!-- Outer Frame with High-Tech Border -->
  <rect x="8" y="8" width="1184" height="344" rx="12" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />
  <rect x="8" y="8" width="1184" height="344" rx="12" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" class="animated-border" opacity="0.4" />

  <!-- Live Status Beacon (Top Right) -->
  <g transform="translate(1080, 42)">
    <circle cx="0" cy="0" r="18" fill="none" stroke="#00e5a3" class="beacon" />
    <circle cx="0" cy="0" r="6" fill="#00e5a3" />
    <text x="-14" y="4" text-anchor="end" fill="#00e5a3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">AUDIT SYSTEM ACTIVE</text>
  </g>

  <!-- Top Category Chip -->
  <g transform="translate(70, 52)">
    <rect x="0" y="0" width="220" height="28" rx="14" fill="rgba(255, 122, 24, 0.15)" stroke="rgba(255, 122, 24, 0.4)" stroke-width="1"/>
    <text x="14" y="18" fill="#ffaa00" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1">⚡ EHS &amp; OSHA ECOSYSTEM</text>
  </g>

  <!-- MAIN HEADLINE (FOREGROUND - Crisp and Unobstructed) -->
  <g transform="translate(70, 135)">
    <!-- High-Contrast Title Shadow -->
    <text x="0" y="0" fill="#000000" opacity="0.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">
      Workplace Safety &amp; OSHA Audit Analyzers
    </text>
    <!-- Crisp Gradient Title -->
    <text x="0" y="-1" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">
      Workplace Safety &amp; OSHA Audit Analyzers
    </text>
  </g>

  <!-- SUBTITLE (FOREGROUND) -->
  <g transform="translate(70, 185)">
    <text x="0" y="0" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="500">
      Curated Guide to Enterprise EHS SaaS Platforms, Automated OSHA Auditing &amp; Open-Source AI Safety Vision
    </text>
  </g>

  <!-- KEY CAPABILITIES / METRIC CARDS (Foreground Badges) -->
  <!-- Card 1: Computer Vision & PPE -->
  <g class="floating-card-1" transform="translate(70, 240)">
    <rect width="245" height="58" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255, 122, 24, 0.35)" stroke-width="1.2" />
    <circle cx="28" cy="29" r="14" fill="rgba(255, 122, 24, 0.2)" />
    <text x="28" y="34" text-anchor="middle" font-size="15">🦺</text>
    <text x="52" y="26" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700">AI PPE Detection</text>
    <text x="52" y="44" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="500">YOLOv8 &amp; Real-time CCTV</text>
  </g>

  <!-- Card 2: OSHA Compliance & Audits -->
  <g class="floating-card-2" transform="translate(330, 240)">
    <rect width="245" height="58" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(0, 229, 163, 0.35)" stroke-width="1.2" />
    <circle cx="28" cy="29" r="14" fill="rgba(0, 229, 163, 0.2)" />
    <text x="28" y="34" text-anchor="middle" font-size="15">📋</text>
    <text x="52" y="26" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700">OSHA 300 &amp; Audit Logs</text>
    <text x="52" y="44" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="500">Automated Regulatory Recordkeeping</text>
  </g>

  <!-- Card 3: Hazard & Incident Analytics -->
  <g class="floating-card-1" transform="translate(590, 240)">
    <rect width="255" height="58" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(0, 210, 255, 0.35)" stroke-width="1.2" />
    <circle cx="28" cy="29" r="14" fill="rgba(0, 210, 255, 0.2)" />
    <text x="28" y="34" text-anchor="middle" font-size="15">📊</text>
    <text x="52" y="26" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700">Incident &amp; CAPA Analytics</text>
    <text x="52" y="44" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="500">Leading Indicators &amp; Root Cause</text>
  </g>

  <!-- Card 4: Open Source & Self-Hosted -->
  <g class="floating-card-2" transform="translate(860, 240)">
    <rect width="265" height="58" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(168, 85, 247, 0.35)" stroke-width="1.2" />
    <circle cx="28" cy="29" r="14" fill="rgba(168, 85, 247, 0.2)" />
    <text x="28" y="34" text-anchor="middle" font-size="15">💻</text>
    <text x="52" y="26" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700">Open-Source &amp; Edge AI</text>
    <text x="52" y="44" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="500">Local-First, Docker &amp; Jetson Ready</text>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="0" y="356" width="1200" height="4" fill="url(#accentGrad)" />
</svg>
